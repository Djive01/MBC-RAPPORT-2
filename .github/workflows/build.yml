name: Build Electron Executable (Windows)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows Application (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Build Electron Executable (.exe)
        run: npm run dist

      - name: Upload Artifacts (Windows Installer & Portable)
        uses: actions/upload-artifact@v4
        with:
          name: Gestion-Caisse-MBC-Windows-Executable
          path: |
            dist-electron/*.exe
            dist-electron/*.blockmap
          if-no-files-found: error
